<html lang="eo" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Literatura Foiro — Indekso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="light"]{
  --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;
  --color-surface-offset:#f3f0ec;--color-border:#d4d1ca;--color-divider:#dcd9d5;
  --color-text:#28251d;--color-text-muted:#7a7974;--color-text-faint:#bab9b4;
  --color-primary:#01696f;--color-primary-hover:#0c4e54;
  --color-primary-highlight:#cedcd8;
  --font-display:'League Spartan',Georgia,serif;
  --font-body:'Proxima Nova Condensed','Helvetica Neue',sans-serif;
  --radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;
  --shadow-sm:0 1px 2px oklch(0.2 0.01 80/0.06);
  --shadow-md:0 4px 12px oklch(0.2 0.01 80/0.08);
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
}
[data-theme="dark"]{
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#1d1c1a;--color-border:#393836;--color-divider:#262523;
  --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
  --color-primary:#4f98a3;--color-primary-hover:#227f8b;
  --color-primary-highlight:#313b3b;
  --shadow-sm:0 1px 2px oklch(0 0 0/0.2);--shadow-md:0 4px 12px oklch(0 0 0/0.3);
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#1d1c1a;--color-border:#393836;--color-divider:#262523;
  --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
  --color-primary:#4f98a3;--color-primary-hover:#227f8b;
  --color-primary-highlight:#313b3b;
}}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scroll-behavior:smooth}
body{min-height:100dvh;font-family:var(--font-body);font-size:1rem;color:var(--color-text);background:var(--color-bg);line-height:1.6}
img,svg{display:block}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
a,button,[role="button"],input,select{transition:color var(--transition),background var(--transition),border-color var(--transition),box-shadow var(--transition)}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm)}

/* LAYOUT */
.site-header{
  background:var(--color-surface);border-bottom:1px solid var(--color-border);
  padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;
  gap:1rem;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);
}
.site-logo{font-family:var(--font-display);font-size:clamp(1.2rem,2vw,1.6rem);font-style:italic;color:var(--color-primary);text-decoration:none}
.site-logo span{color:var(--color-text-muted);font-style:normal;font-size:0.75rem;display:block;font-family:var(--font-body);letter-spacing:0.08em;text-transform:uppercase;margin-top:1.0rem;}

.theme-btn{
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--color-text-muted);border:1px solid var(--color-border);
}
.theme-btn:hover{color:var(--color-text);border-color:var(--color-text)}

.main{max-width:1200px;margin:0 auto;padding:2rem 1.5rem}

/* SEARCH PANEL */
.search-panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1.5rem;box-shadow:var(--shadow-sm)}
.search-panel h2{font-family:var(--font-display);font-size:1.25rem;margin-bottom:1rem;color:var(--color-text)}

.search-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0.75rem}

.field-group{display:flex;flex-direction:column;gap:0.35rem}
.field-group label{font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-muted)}
.field-group input,.field-group select{
  padding:0.5rem 0.75rem;border:1px solid var(--color-border);border-radius:var(--radius-md);
  background:var(--color-bg);color:var(--color-text);font-size:0.9rem;width:100%;
}
.field-group input:focus,.field-group select:focus{border-color:var(--color-primary);outline:none;box-shadow:0 0 0 3px oklch(from var(--color-primary) l c h/0.15)}

.search-actions{display:flex;gap:0.75rem;align-items:center;margin-top:1rem;flex-wrap:wrap}
.btn-primary{
  padding:0.55rem 1.25rem;background:var(--color-primary);color:#fff;border-radius:var(--radius-md);
  font-size:0.9rem;font-weight:600;
}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-ghost{
  padding:0.55rem 1.25rem;background:transparent;color:var(--color-text-muted);border-radius:var(--radius-md);
  font-size:0.9rem;border:1px solid var(--color-border);
}
.btn-ghost:hover{color:var(--color-text);border-color:var(--color-text)}

/* RESULTS */
.results-bar{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  margin-bottom:0.75rem;flex-wrap:wrap;
}
.results-count{font-size:0.85rem;color:var(--color-text-muted)}
.results-count strong{color:var(--color-text)}

.table-wrap{overflow-x:auto;border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:0.875rem;min-width:900px}
thead{background:var(--color-surface);position:sticky;top:0px;z-index:10}
th{
  padding:0.75rem 1rem;text-align:left;font-size:0.75rem;font-weight:700;
  text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-muted);
  border-bottom:2px solid var(--color-border);white-space:nowrap;
  cursor:pointer;user-select:none;
}
th:hover{color:var(--color-text)}
th .sort-icon{display:inline-block;margin-left:4px;opacity:0.4;font-style:normal}
th.sorted .sort-icon{opacity:1;color:var(--color-primary)}

tbody tr{border-bottom:1px solid var(--color-divider)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--color-surface)}
tbody tr:nth-child(even){background:var(--color-surface-2)}
tbody tr:nth-child(even):hover{background:var(--color-surface-offset)}

td{padding:0.6rem 1rem;vertical-align:top;color:var(--color-text)}
td.muted{color:var(--color-text-muted)}
td em{background:oklch(from var(--color-primary) l c h/0.18);border-radius:2px;padding:0 2px;font-style:normal;color:var(--color-primary-hover)}

.badge{
  display:inline-block;padding:0.15rem 0.5rem;border-radius:9999px;
  font-size:0.7rem;font-weight:600;letter-spacing:0.04em;
  background:var(--color-primary-highlight);color:var(--color-primary-hover);
  white-space:nowrap;
}

.no-results{
  padding:4rem 2rem;text-align:center;color:var(--color-text-muted);
  font-size:0.95rem;
}
.no-results strong{display:block;font-size:1.1rem;color:var(--color-text);margin-bottom:0.5rem}

/* PAGINATION */
.pagination{display:flex;align-items:center;gap:0.5rem;justify-content:center;margin-top:1.25rem;flex-wrap:wrap}
.page-btn{
  min-width:36px;height:36px;padding:0 0.6rem;border-radius:var(--radius-md);
  border:1px solid var(--color-border);font-size:0.85rem;color:var(--color-text-muted);
  display:flex;align-items:center;justify-content:center;
}
.page-btn:hover:not(:disabled){border-color:var(--color-primary);color:var(--color-primary)}
.page-btn.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.page-btn:disabled{opacity:0.35;cursor:not-allowed}
.page-info{font-size:0.8rem;color:var(--color-text-muted);padding:0 0.5rem}

@media(max-width:600px){
  .search-grid{grid-template-columns:1fr}
  .site-logo span{display:none}
  .main{padding:1rem}
}

/* ── Multi-select checkbox dropdown ──────────────────────── */
.multi-select { position: relative; user-select: none; }
.ms-toggle {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.45rem 0.75rem; border: 1px solid var(--color-border);
  border-radius: 6px; background: var(--color-surface);
  cursor: pointer; font-size: 0.9rem; color: var(--color-text);
  min-height: 2.2rem; transition: border-color .15s;
}
.ms-toggle:hover { border-color: var(--color-accent); }
.ms-arrow { font-size: 0.75rem; color: var(--color-text-muted); margin-left: 6px; transition: transform .2s; }
.multi-select.open .ms-arrow { transform: rotate(180deg); }
.ms-dropdown {
  display: none; position: absolute; z-index: 999; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  max-height: 260px; overflow-y: auto; padding: 6px 0;
}
.multi-select.open .ms-dropdown { display: block; }
.ms-option {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; font-size: 0.875rem; cursor: pointer;
  color: var(--color-text); transition: background .1s;
}
.ms-option:hover { background: var(--color-hover, rgba(128,128,128,.08)); }
.ms-option input[type=checkbox] { accent-color: var(--color-accent); width: 14px; height: 14px; flex-shrink: 0; }
.ms-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
</style>
</head>

          <th data-col="rubriko" onclick="sortBy('rubriko')">Rubriktitolo<em class="sort-icon">↕</em></th>
          <th data-col="ŝlosilvorto" onclick="sortBy('ŝlosilvorto')">Tipologio<em class="sort-icon">↕</em></th>

        </tr>
      </thead>
      <tbody id="results-body">
      </tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>

</main>

const PAGE_SIZE = 50;
let filtered = [...DATA];
let sortCol = '';
let sortDir = 1;
let currentPage = 1;

function unique(key) {
  const s = new Set();
  DATA.forEach(r => { if(r[key]) s.add(r[key].trim()); });
  return Array.from(s).sort((a,b)=>a.localeCompare(b,'eo'));
}

function populateSelect(id, key) {
  const sel = document.getElementById(id);
  unique(key).forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  });
}

populateSelect('f-fontlingvo', 'fontlingvo');
populateSelect('f-rubriko', 'rubriko');
// Multi-select helper
function toggleMs(id) {
  const el = document.getElementById(id);
  const isOpen = el.classList.contains('open');
  document.querySelectorAll('.multi-select.open').forEach(e => e.classList.remove('open'));
  if (!isOpen) el.classList.add('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.multi-select')) {
    document.querySelectorAll('.multi-select.open').forEach(el => el.classList.remove('open'));
  }
});

function buildMs(msId, values) {
  const list = document.getElementById(msId + '-list');
  values.forEach(v => {
    const lbl = document.createElement('label');
    lbl.className = 'ms-option';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.value = v;
    cb.addEventListener('change', () => { updateMsLabel(msId); doSearch(); });
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(v));
    list.appendChild(lbl);
  });
}

function getMsValues(msId) {
  return Array.from(document.querySelectorAll('#' + msId + '-list input:checked')).map(cb => cb.value);
}

function updateMsLabel(msId) {
  const vals = getMsValues(msId);
  const lbl = document.getElementById(msId + '-label');
  lbl.textContent = vals.length === 0 ? '— ĉiuj —' : vals.join(', ');
}

function resetMs(msId) {
  document.querySelectorAll('#' + msId + '-list input').forEach(cb => cb.checked = false);
  updateMsLabel(msId);
}

// Build tipologio checkboxes
buildMs('ms-tipologio', ["prozo originala","prozo tradukita","poezio originala","poezio tradukita","teatro originala","teatro tradukita","eseo originala","eseo tradukita","intervjuo","recenzo","anonco","nekrologo"]);

// Build jaro checkboxes
(function(){
  const years = new Set();
  DATA.forEach(r => { const m = r['jaro'] && r['jaro'].match(/\d{4}/); if(m) years.add(m[0]); });
  buildMs('ms-jaro', Array.from(years).sort());
})();

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function highlight(text, query) {
  if(!query || !text) return esc(text||'');
  const re = new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')', 'gi');
  return esc(text).replace(re, '<em>$1</em>');
}

function contains(val, q) {
  if(!q) return true;
  return val.toLowerCase().includes(q.toLowerCase());
}

function doSearch() {
  const autoro = document.getElementById('f-autoro').value.trim();
  const titolo = document.getElementById('f-titolo').value.trim();
  const tradukis = document.getElementById('f-tradukis').value.trim();
  const fontlingvo = document.getElementById('f-fontlingvo').value;
  const rubriko = document.getElementById('f-rubriko').value;
  const tipologioj = getMsValues('ms-tipologio');
  const recenzita = document.getElementById('f-recenzita').value.trim();
  const jaroj = getMsValues('ms-jaro');

  filtered = DATA.filter(r => {
    if(autoro && !contains(r['aŭtoro(j)'], autoro)) return false;
    if(titolo && !contains(r['titolo'], titolo)) return false;
    if(tradukis && !contains(r['tradukis'], tradukis)) return false;
    if(fontlingvo && r['fontlingvo'].trim() !== fontlingvo) return false;
    if(rubriko && r['rubriko'].trim() !== rubriko) return false;
    if(tipologioj.length && !tipologioj.includes(r['tipologio'].trim())) return false;
    if(recenzita && !contains(r['recenzita verko/filmo'], recenzita)) return false;
    if(jaroj.length && !jaroj.some(y => r['jaro'].includes(y))) return false;
    return true;
  });

  if(sortCol) applySort(false);
  currentPage = 1;
  render();
}

function resetFilters() {
  ['f-autoro','f-titolo','f-tradukis','f-recenzita'].forEach(id => document.getElementById(id).value='');
  ['f-fontlingvo','f-rubriko'].forEach(id => document.getElementById(id).value='');
  resetMs('ms-tipologio'); resetMs('ms-jaro');
  sortCol=''; sortDir=1;
  document.querySelectorAll('th').forEach(th=>{th.classList.remove('sorted');th.querySelector('.sort-icon').textContent='↕';});
  doSearch();
}

function sortBy(col) {
  if(sortCol===col) sortDir*=-1;
  else { sortCol=col; sortDir=1; }
  document.querySelectorAll('th').forEach(th=>{
    th.classList.remove('sorted');
    th.querySelector('.sort-icon').textContent='↕';
  });
  const th = document.querySelector(`th[data-col="${col}"]`);
  if(th){ th.classList.add('sorted'); th.querySelector('.sort-icon').textContent=sortDir===1?'↑':'↓'; }
  applySort(true);
}

function applySort(rerender) {
  filtered.sort((a,b)=>{
    const av=(a[sortCol]||'').toLowerCase();
    const bv=(b[sortCol]||'').toLowerCase();
    return av<bv?-sortDir:av>bv?sortDir:0;
  });
  if(rerender){ currentPage=1; render(); }
}

function render() {
  const autoro = document.getElementById('f-autoro').value.trim();
  const titolo = document.getElementById('f-titolo').value.trim();
  const tradukis = document.getElementById('f-tradukis').value.trim();
  const recenzita = document.getElementById('f-recenzita').value.trim();

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total/PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage-1)*PAGE_SIZE;
  const slice = filtered.slice(start, start+PAGE_SIZE);

  const countEl = document.getElementById('results-count');
  countEl.innerHTML = `<strong>${total.toLocaleString()}</strong> rezulto(j) trovita(j)` +
    (total>PAGE_SIZE ? ` &mdash; paĝo ${currentPage} el ${totalPages}` : '');

  const tbody = document.getElementById('results-body');
  if(total===0){
    tbody.innerHTML=`<tr><td colspan="10"><div class="no-results"><strong>Neniu rezulto</strong>Ŝanĝu la serĉkriteriojn kaj reprovu.</div></td></tr>`;
  } else {
    tbody.innerHTML = slice.map(r => `
      <tr>
        <td class="muted">${esc(r['jaro'])}</td>
        <td class="muted">${esc(r['n-ro'])}</td>
        <td class="muted">${esc(r['paĝo(j)'])}</td>
        <td>${highlight(r['aŭtoro(j)'], autoro)}</td>
        <td>${highlight(r['titolo'], titolo)}</td>
        <td class="muted">${highlight(r['tradukis'], tradukis)}</td>
        <td class="muted">${r['fontlingvo'] ? '<span class="badge">'+esc(r['fontlingvo'])+'</span>' : ''}</td>
        <td>${r['rubriko'] ? '<span class="badge">'+esc(r['rubriko'])+'</span>' : ''}</td>
        <td class="muted">${esc(r['ŝlosilvorto'])}</td>
        <td>${highlight(r['recenzita verko/filmo'], recenzita)}</td>
      </tr>`).join('');
  }

  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const el = document.getElementById('pagination');
  if(totalPages<=1){ el.innerHTML=''; return; }
  let h='';
  h+=`<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''} aria-label="Antaŭa">&#8592;</button>`;

  const range = [];
  range.push(1);
  if(currentPage>3) range.push('...');
  for(let i=Math.max(2,currentPage-1);i<=Math.min(totalPages-1,currentPage+1);i++) range.push(i);
  if(currentPage<totalPages-2) range.push('...');
  if(totalPages>1) range.push(totalPages);

  range.forEach(p=>{
    if(p==='...') h+=`<span class="page-info">…</span>`;
    else h+=`<button class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  });

  h+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''} aria-label="Sekva">&#8594;</button>`;
  el.innerHTML=h;
}

function goPage(p) {
  const totalPages = Math.ceil(filtered.length/PAGE_SIZE);
  if(p<1||p>totalPages) return;
  currentPage=p;
  render();
  document.querySelector('.table-wrap').scrollIntoView({behavior:'smooth',block:'start'});
}

// Debounced live search on text fields
let debTimer;
['f-autoro','f-titolo','f-tradukis','f-recenzita'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>{
    clearTimeout(debTimer);
    debTimer=setTimeout(doSearch,300);
  });
  document.getElementById(id).addEventListener('keydown',e=>{
    if(e.key==='Enter') doSearch();
  });
});
['f-fontlingvo','f-rubriko','f-tipologio','f-jaro'].forEach(id=>{
  document.getElementById(id).addEventListener('change', doSearch);
});

// Initial render — all data
doSearch();
